<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Let Me Choose</title>
    <style>
        /* 기본 스타일 리셋 및 배경 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none; /* 텍스트 드래그 방지 */
        }

        body {
            background-color: #333333;
            color: #4cd137;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 메인 컨테이너 (올려주신 이미지 레이아웃 비율 반영) */
        .app-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: normal;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        /* 공통 카드 스타일 */
        .card {
            background-color: #000000;
            border-radius: 16px;
            width: 100%;
            border: none;
            color: #4cd137;
        }

        /* 1. 입력창 */
        .input-box {
            height: 60px;
            padding: 0 20px;
            font-size: 16px;
            outline: none;
            text-align: center;
        }
        .input-box::placeholder {
            color: #666666;
        }

        /* 2. 후보군 리스트 보여주는 큰 칸 */
        .list-box {
            height: 300px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        /* 리스트 내부 아이템 스타일 */
        .item {
            background-color: #222222;
            padding: 10px 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 90%;
            font-size: 15px;
            animation: fadeIn 0.3s ease;
            font-weight: bold;
            text-align: left;
            display: flex;
            justify-content: space-between;
        }
        
        .item-delete {
            color: #ff5555;
            cursor: pointer;
        }

        /* 3. 결과 노출 칸 */
        .result-box {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: #4cd137; /* 흰색 폰트로 변경 및 크기 소폭 확대 */
        }

        /* 4. 선택 버튼 */
        .btn-choose {
            height: 70px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-choose:active {
            background-color: #111111;
        }

        /* 하단 푸터 (signature, since date) */
        .footer {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            margin-top: 8px;
            font-size: 13px;
            color: #aaaaaa;
        }

        /* 스크롤바 커스텀 */
        .list-box::-webkit-scrollbar {
            width: 6px;
        }
        .list-box::-webkit-scrollbar-thumb {
            background-color: #333333;
            border-radius: 4px;
        }

        /* 애니메이션 효과 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Let Me Choose</h1>
        
        <!-- 1. 후보 입력창 -->
        <input type="text" id="candidateInput" class="card input-box" placeholder="후보를 입력하고 Enter를 누르세요" autocomplete="off">
        
        <!-- 2. 후보군 배열 칸 -->
        <div id="candidateList" class="card list-box">
            <!-- 입력된 후보들이 여기에 추가됩니다 -->
        </div>
        
        <!-- 3. 랜덤 선택 결과 노출 칸 -->
        <div id="resultBox" class="card result-box">
            <!-- 결과가 여기에 표시됩니다 -->
        </div>
        
        <!-- 4. 실행 버튼 -->
        <button id="chooseBtn" class="card btn-choose">Choose!</button>
        
        <!-- 하단 정보 영역 -->
        <div class="footer">
            <span id="signature">by JJeon</span>
            <span id="sinceDate">Since. 2026.05.23</span>
        </div>
    </div>

    <script>
        // 전역 배열로 후보군 관리 (localStorage 사용 안 함)
        let candidates = [];

        const inputEl = document.getElementById('candidateInput');
        const listEl = document.getElementById('candidateList');
        const resultEl = document.getElementById('resultBox');
        const btnEl = document.getElementById('chooseBtn');

        // 후보 추가 함수
        function addCandidate() {
            const value = inputEl.value.trim();
            if (!value) return;

            candidates.push(value);
            inputEl.value = ''; // 입력창 비우기
            renderList();
            resultEl.textContent = ''; // 새 후보가 들어오면 기존 결과 초기화
        }

        // 후보 목록 리렌더링
        function renderList() {
            listEl.innerHTML = '';
            candidates.forEach((candidate, index) => {
                const item = document.createElement('div');
                item.className = 'item';
                
                const text = document.createElement('span');
                text.textContent = `${index + 1}. ${candidate}`;
                
                const deleteBtn = document.createElement('span');
                deleteBtn.className = 'item-delete';
                deleteBtn.textContent = '✕';
                deleteBtn.onclick = () => removeCandidate(index);

                item.appendChild(text);
                item.appendChild(deleteBtn);
                listEl.appendChild(item);
            });
            
            // 스크롤을 항상 가장 아래로
            listEl.scrollTop = listEl.scrollHeight;
        }

        // 후보 삭제 함수
        function removeCandidate(index) {
            candidates.splice(index, 1);
            renderList();
            resultEl.textContent = '';
        }

        // 랜덤 선택 함수
        function pickRandom() {
            if (candidates.length === 0) {
                resultEl.textContent = '후보를 먼저 입력해주세요!';
                return;
            }

            // 시각적 효과를 위해 짧은 롤링 연출 후 최종 선택
            let count = 0;
            const interval = setInterval(() => {
                const tempIndex = Math.floor(Math.random() * candidates.length);
                resultEl.textContent = candidates[tempIndex];
                count++;
                
                if (count > 6) {
                    clearInterval(interval);
                    const finalIndex = Math.floor(Math.random() * candidates.length);
                    // 요청 반영: 이모티콘 제거 및 깔끔한 흰색 이름만 노출
                    resultEl.textContent = candidates[finalIndex];
                }
            }, 80);
        }

        // 이벤트 리스너 등록
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                addCandidate();
            }
        });

        btnEl.addEventListener('click', pickRandom);

        // 우클릭 방지
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
